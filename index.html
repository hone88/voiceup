<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VOICEUP</title>
<meta name="description" content="思いついた「欲しい」「困った」を、声でそのまま投稿。">
<meta name="theme-color" content="#f6f7f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121613" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Dela+Gothic+One&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">VOICE<span>UP</span></div>
    <div class="tag">Your Voice Creates Value.</div>
  </header>
  <div id="status" class="notice" hidden></div>

  <!-- 声を出す -->
  <section id="v-post" hidden>
    <div id="step-input">
      <h1>何が欲しい？<br>何に困ってる？</h1>
      <p class="sub">思ったことを、そのまま話してみよう。</p>
      <button class="mic" id="micBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <b id="micLabel">声で投稿する</b>
        <small id="micSub">タップして話すだけ</small>
      </button>
      <p class="hint" id="micHint" hidden></p>

      <div class="field">
        <label class="label" for="text">あなたの声</label>
        <textarea id="text" maxlength="400" placeholder="例：空きコマに1時間だけ座れる静かな場所が欲しい"></textarea>
        <div class="count"><span id="cnt">0</span> / 400</div>
      </div>
      <div class="field">
        <p class="label">カテゴリ</p>
        <div class="chips" id="catChips"></div>
      </div>
      <div class="field">
        <p class="label">公開のしかた</p>
        <div class="seg">
          <button type="button" id="anonOn" aria-pressed="true"><b>匿名で投稿</b><small>名前は表示されない</small></button>
          <button type="button" id="anonOff" aria-pressed="false"><b>ニックネーム</b><small>好きな名前を表示</small></button>
        </div>
        <input id="nick" type="text" maxlength="20" placeholder="ニックネーム（20文字まで）" hidden>
      </div>
      <button class="primary" id="toConfirm" type="button" disabled>確認へ進む</button>
    </div>

    <div id="step-confirm" hidden>
      <h1>この内容で投稿する？</h1>
      <p class="sub">誤変換や、個人が分かる情報がないか確認しよう。</p>
      <div class="confirm">
        <div class="meta"><span class="cat" id="cCat"></span><span id="cAnon"></span></div>
        <p class="q" id="cText"></p>
      </div>
      <button class="primary" id="submit" type="button">投稿する</button>
      <button class="ghost" id="back" type="button">戻って直す</button>
    </div>
  </section>

  <!-- みんなの声 -->
  <section id="v-feed">
    <div class="toolbar">
      <div class="chips" id="filterChips"></div>
      <div class="actions">
        <div class="sort">
          <button type="button" data-sort="new" aria-pressed="true">新着</button>
          <button type="button" data-sort="emp" aria-pressed="false">共感が多い順</button>
        </div>
        <span class="stat" id="stat"></span>
      </div>
    </div>
    <div class="list" id="list"><div class="empty">みんなの声を読み込み中…</div></div>
  </section>
</div>

<nav>
  <div class="in" role="tablist">
    <button role="tab" id="tabFeed" aria-selected="true" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>みんなの声</button>
    <button role="tab" id="tabPost" aria-selected="false" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>声を出す</button>
  </div>
</nav>
<div class="toast" id="toast" role="status" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
